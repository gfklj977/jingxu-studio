name: Desktop builds

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci
      - run: npm run release:check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:release
      - run: PYTHONPATH=backend .venv/bin/pytest -q backend/tests
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  package:
    needs: quality
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: desktop:pack:mac
          - os: windows-2022
            command: desktop:pack:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m venv .venv
      - if: runner.os != 'Windows'
        run: .venv/bin/pip install -r backend/requirements.txt
      - if: runner.os == 'Windows'
        run: .venv/Scripts/pip install -r backend/requirements.txt
      - run: npm ci
      - name: Build signed macOS package
        if: runner.os == 'macOS' && env.MAC_CSC_LINK != ''
        run: npm run ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build signed Windows package
        if: runner.os == 'Windows' && env.WIN_CSC_LINK != ''
        run: npm run ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build unsigned internal package
        if: (runner.os == 'macOS' && env.MAC_CSC_LINK == '') || (runner.os == 'Windows' && env.WIN_CSC_LINK == '')
        run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run release:checksums
      - run: npm run release:verify
      - run: npm run release:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: jingxu-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "镜序工坊 $GITHUB_REF_NAME"
          find release-artifacts -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
